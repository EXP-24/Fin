name: Finsight CI

# 1. Xác định KHI NÀO pipeline này được chạy
on:
  push:
    branches: [ "main" ] # Chạy khi có code push lên nhánh main
  pull_request:
    branches: [ "main" ] # Hoặc khi có Pull Request vào nhánh main

# 2. Định nghĩa các CÔNG VIỆC (jobs) cần làm
jobs:
  # --- JOB 1: Kiểm tra Backend ---
  backend-tests:
    runs-on: ubuntu-latest # Chạy trên máy ảo Linux của GitHub

    steps:
    # Lấy code của bạn về máy ảo
    - name: Checkout code
      uses: actions/checkout@v4

    # Cài đặt Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Bạn có thể đổi sang version Python bạn đang dùng (VD: 3.9, 3.11)

    # Cài đặt các thư viện cần thiết
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Cài thêm pytest nếu bạn dùng nó để test
        pip install pytest 

    # Chạy test backend (giả sử bạn dùng pytest và code test nằm trong thư mục tests/)
    - name: Run backend tests
      run: |
        pytest tests/

  # --- JOB 2: Kiểm tra Frontend ---
  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Cài đặt Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Phiên bản Node.js, nên trùng với bản bạn đang dùng ở máy local

    # Đi vào thư mục frontend, cài đặt thư viện và build thử
    - name: Install and Build Frontend
      working-directory: ./frontend
      run: |
        npm install
        npm run build
